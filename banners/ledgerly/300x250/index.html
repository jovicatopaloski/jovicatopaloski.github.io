<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="ad.size" content="width=300,height=250"><title>Ledgerly 300x250</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/SplitText.min.js"></script><script>var clickTag="https://example.com"</script><style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0}p{margin:0}#banner{position:relative;width:300px;height:250px;overflow:hidden;cursor:pointer}</style><style>
#banner{background:#0B1F3A;color:#fff;font-family:"Manrope",sans-serif}
.glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(61,220,151,.28) 0%,rgba(61,220,151,0) 70%);pointer-events:none}
.logo{position:absolute;display:flex;align-items:center;gap:6px;font-weight:800;letter-spacing:-.01em;z-index:5}
.logo i{display:block;border-radius:5px;background:#3DDC97;position:relative}
.logo i::after{content:"";position:absolute;left:28%;top:22%;width:22%;height:56%;border-left:2px solid #0B1F3A;border-bottom:2px solid #0B1F3A;width:44%}
.headline,.endline{position:absolute;font-weight:800;line-height:1.18;letter-spacing:-.02em}
.headline em,.endline em{font-style:normal;color:#3DDC97}
.endline{opacity:0}
.card{position:absolute;background:#13294A;border:1px solid rgba(255,255,255,.08);border-radius:12px;opacity:0;overflow:hidden}
.card .label{font-size:var(--label-fs);color:#8FA3C0;font-weight:500}
.card .amount{font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card svg{position:absolute;left:0;bottom:0}
.chip{position:absolute;display:flex;align-items:center;gap:5px;background:#fff;color:#0B1F3A;border-radius:999px;font-weight:700;white-space:nowrap;opacity:0;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.chip b{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#3DDC97;color:#0B1F3A;font-size:.85em}
.cta{position:absolute;display:flex;align-items:center;justify-content:center;gap:6px;background:#3DDC97;color:#0B1F3A;border:0;border-radius:999px;font-family:inherit;font-weight:800;cursor:pointer;opacity:0;transform:scale(0)}

:root{--label-fs:9px}
.glow{width:260px;height:260px;right:-120px;top:-110px}
.logo{top:14px;left:16px;font-size:13px}.logo i{width:16px;height:16px}
.headline{top:40px;left:16px;width:270px;font-size:21px}
.endline{top:78px;left:16px;width:270px;font-size:24px}
.card{left:16px;top:108px;width:168px;height:92px;padding:10px 12px}
.card .amount{font-size:26px;margin-top:2px}
.chip{font-size:9.5px;padding:5px 9px 5px 5px}.chip b{width:14px;height:14px}
.c1{top:118px;left:176px}.c2{top:160px;left:186px}
.cta{left:16px;bottom:18px;width:128px;height:30px;font-size:11px}
</style></head><body><div id="banner" onclick='window.open(clickTag,"_blank")'>
<div class="glow"></div>
<div class="logo"><i></i>Ledgerly</div>
<p class="headline">Your money,<br><em>finally organized.</em></p>
<div class="card"><p class="label">Saved this year</p><p class="amount">$0</p>
<svg width="168" height="40" viewBox="0 0 168 40" fill="none"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3DDC97" stop-opacity=".35"/><stop offset="1" stop-color="#3DDC97" stop-opacity="0"/></linearGradient></defs><path class="area" d="M0,34.0 L23.5,31.2 L47.0,32.8 L70.6,24.0 L94.1,25.6 L117.6,16.0 L141.1,12.8 L168,4.0 L168,40 L0,40 Z" fill="url(#ga)"/><path class="line" d="M0,34.0 L23.5,31.2 L47.0,32.8 L70.6,24.0 L94.1,25.6 L117.6,16.0 L141.1,12.8 L168,4.0" stroke="#3DDC97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="chip c1"><b>&#10003;</b>Bills paid on time</div><div class="chip c2"><b>&#9650;</b>Savings +12%</div>
<p class="endline">Budget smarter<br>in <em>minutes.</em></p>
<button class="cta">Get the app <svg width="12" height="10" viewBox="0 0 12 10" fill="none"><path d="M1 5h9M6.5 1.5 10 5 6.5 8.5" stroke="#0B1F3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>
<script>
window.onload=function(){document.fonts.ready.then(function(){
gsap.registerPlugin(SplitText);
var head=SplitText.create(".headline",{type:"lines",mask:"lines"});
var end=SplitText.create(".endline",{type:"lines",mask:"lines"});
head.masks.concat(end.masks).forEach(function(m){m.style.padding="0.06em 0 0.12em";m.style.margin="-0.06em 0 -0.12em"});
var line=document.querySelector(".card .line"),len=line.getTotalLength();
var amount=document.querySelector(".card .amount"),counter={v:0};
gsap.set(line,{strokeDasharray:len,strokeDashoffset:len});
gsap.set(".card .area",{opacity:0});
var tl=gsap.timeline({repeat:-1,repeatDelay:.3});
tl.from(head.lines,{xPercent:-105,duration:.65,stagger:.14,ease:"power3.out"})
  .fromTo(".card",{opacity:0,y:18},{opacity:1,y:0,duration:.55,ease:"power2.out"},"-=.2")
  .fromTo(counter,{v:0},{v:1240,duration:1.4,ease:"power2.out",onUpdate:function(){amount.textContent="$"+Math.round(counter.v).toLocaleString("en-US")}},"-=.15")
  .to(line,{strokeDashoffset:0,duration:1.4,ease:"power2.out"},"<")
  .to(".card .area",{opacity:1,duration:.8},"<+=.6")
  .fromTo(".chip",{opacity:0,scale:.6,y:8},{opacity:1,scale:1,y:0,duration:.45,stagger:.3,ease:"back.out(2)"},"-=.6")
  .to({},{duration:1.6})
  .to([".headline",".card",".chip"],{opacity:0,y:-10,duration:.4,ease:"power2.in",stagger:.05})
  .set(".endline",{opacity:1})
  .from(end.lines,{yPercent:110,duration:.6,stagger:.14,ease:"power3.out"})
  .to(".cta",{opacity:1,scale:1,duration:.55,ease:"back.out(1.7)"},"-=.25")
  .to({},{duration:2.4})
  .to([".endline",".cta"],{opacity:0,duration:.45});
})};
</script></body></html>
